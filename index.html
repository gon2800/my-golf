<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F6FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Golf">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>My Golf</title>
<style>
:root{
  --bg:#F5F6FB; --card:#FFFFFF; --ink:#1F2437; --sub:#7A809A;
  --line:#EBEDF4; --line-strong:#D3D8E6; --accent:#5B54E8; --accent-dark:#4C46D6; --accent-soft:#EEEDFD;
  --danger:#EF6C6C; --danger-soft:#FDECEC;
  --shadow:0 1px 2px rgba(31,36,55,.04),0 8px 24px rgba(31,36,55,.06);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;background:var(--bg);color:var(--ink);}

#app{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;}

/* ── 헤더 ── */
.app-header{background:transparent;padding:max(env(safe-area-inset-top),14px) 16px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.header-icon{width:42px;height:42px;border-radius:13px;overflow:hidden;flex-shrink:0;}
.header-icon img{width:100%;height:100%;object-fit:cover;}
.header-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-0.3px;}
.header-settings{margin-left:auto;width:40px;height:40px;border-radius:9px;border:none;background:transparent;color:#000;font-size:22px;display:flex;align-items:center;justify-content:center;}
.header-settings:active{background:rgba(0,0,0,.06);}

/* ── 탭바 (견출지 스타일) ── */
.tab-bar{display:flex;padding:0 10px;overflow-x:auto;background:transparent;flex-shrink:0;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-item{position:relative;flex:1;min-width:66px;padding:11px 2px 10px;text-align:center;font-size:14px;font-weight:700;color:var(--sub);background:transparent;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;user-select:none;}
.tab-item.active{background:var(--card);color:var(--accent);font-weight:800;border-bottom:1px solid var(--card);margin-bottom:-1px;}
.tab-item.active::before,.tab-item.active::after{content:"";position:absolute;bottom:0;width:8px;height:8px;pointer-events:none;}
.tab-item.active::before{left:-8px;background:radial-gradient(circle at top left, transparent 8px, var(--card) 8px);}
.tab-item.active::after{right:-8px;background:radial-gradient(circle at top right, transparent 8px, var(--card) 8px);}
.tab-item:first-child.active::before{content:none;}
.tab-item:last-child.active::after{content:none;}
.tab-item:first-child.active{border-top-left-radius:var(--radius);}
.tab-item:last-child.active{border-top-right-radius:var(--radius);}
.tab-item .ti{display:block;font-size:19px;margin-bottom:3px;}

/* ── 스크린 / 카드 ── */
.screens{position:relative;flex:1;overflow:hidden;}
.screen{display:none;padding:0 10px 10px;overflow-y:auto;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:pan-y;}
.screen.active{display:block;}
.tab-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 74px;min-height:220px;position:relative;}
.tab-card + .tab-card{margin-top:12px;}
.tab-card.corner-first{border-radius:0 var(--radius) var(--radius) var(--radius);}
.tab-card.corner-last{border-radius:var(--radius) 0 var(--radius) var(--radius);}

/* ── 버튼 ── */
.btn-primary{width:100%;height:46px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:700;}
.btn-primary:active{background:var(--accent-dark);}
.btn-primary:disabled{opacity:.5;}
.btn-secondary{height:40px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
.btn-secondary:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.btn-secondary.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.icon-btn{width:34px;height:34px;border-radius:9px;border:none;background:var(--danger-soft);color:var(--danger);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn.neutral{background:var(--bg);color:var(--sub);}
.icon-btn.labeled{width:auto;padding:0 10px;gap:4px;font-size:12px;font-weight:700;}

/* ── 입력 필드 ── */
.field-row{margin-bottom:12px;}
.field-row label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;}
.field-row input{width:100%;height:40px;border-radius:10px;border:2px solid var(--accent);padding:0 10px;font-size:15px;font-weight:500;background:var(--card);color:var(--ink);}
.field-row select{width:100%;height:40px;border-radius:10px;border:1.5px solid var(--line);padding:0 8px;font-size:15px;font-weight:700;background:var(--bg);color:var(--ink);-webkit-appearance:none;}

/* ── 바텀 시트 ── */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);z-index:21;max-width:430px;margin:0 auto;max-height:86vh;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 14px;}
.sheet-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:14px;}

/* ── 오버레이 / 토스트 ── */
#overlay{position:fixed;inset:0;background:rgba(15,17,30,.42);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s ease;}
#overlay.show{opacity:1;pointer-events:auto;}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(31,36,55,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;max-width:86%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ══ 모임 탭 ══ */
.empty-state{padding:40px 10px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7;}
.empty-state .ti{font-size:32px;color:var(--line-strong);display:block;margin-bottom:10px;}
.group-card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;}
.group-card:last-child{margin-bottom:0;}
.group-card.selected{background:var(--accent-soft);border:2px solid var(--accent);padding:12px;}
.group-card-top{display:flex;align-items:center;gap:8px;}
.group-name{font-size:15px;font-weight:800;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.group-members{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5;}
.group-actions{display:flex;gap:6px;flex-shrink:0;}

.member-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.member-row input{flex:1;min-width:0;height:40px;border-radius:10px;border:1.5px solid var(--line);padding:0 10px;font-size:14px;background:var(--card);color:var(--ink);}
.member-row input:focus{outline:none;border-color:var(--accent);}
.member-name-input{flex:0.9 !important;}
.member-addr-input{flex:1.4 !important;}
.add-member-btn{width:100%;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);border:none;font-size:13px;font-weight:700;margin:2px 0 16px;display:flex;align-items:center;justify-content:center;gap:5px;}

/* ══ 검토하기 탭 ══ */
.ctrl-label{font-size:11px;font-weight:700;color:var(--sub);margin:14px 0 6px;}
.ctrl-label:first-child{margin-top:0;}
.segment{display:flex;gap:4px;background:var(--bg);border-radius:11px;padding:3px;}
.segment-item{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;}
.segment-item.active{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(31,36,55,.08);}

.calc-btn-row{margin-top:16px;}
.calc-progress{font-size:12px;color:var(--accent);text-align:center;margin-top:8px;}

.course-addr{font-size:12px;color:var(--sub);margin-top:3px;}
.badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
.badge.public{background:#E9F7EF;color:#2E9E5B;}
.badge.visited{background:#FFF3D9;color:#B4790C;}
.course-summary{font-size:12px;color:var(--sub);line-height:1.6;}
.course-summary b{color:var(--accent);}
.course-btn-row{display:flex;gap:8px;margin-top:12px;}
.course-btn-row .btn-secondary{flex:1;justify-content:center;}

/* ── 지도 ── */
.map-card{padding:14px;}
#mapContainer{width:100%;height:380px;border-radius:12px;overflow:hidden;background:var(--bg);}
.map-legend{display:flex;gap:16px;align-items:center;margin-top:10px;font-size:11px;color:var(--sub);}
.map-legend-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-2px;}
.map-member-dot{width:32px;height:32px;border-radius:50%;background:#2E9E5B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;}
.map-course-dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;cursor:pointer;}

/* ══ 설정 시트 ══ */
.settings-help{font-size:11px;color:var(--sub);line-height:1.6;margin:-4px 0 14px;}
.cache-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:6px 0;border-bottom:1px solid var(--line);}
.cache-stat:last-of-type{border-bottom:none;}

.hidden{display:none !important;}

@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css');
</style>
</head>
<body>
<div id="app">

  <div class="app-header">
    <div class="header-icon"><img src="/icons/icon-192.png" alt="My Golf"></div>
    <span class="header-title">My Golf</span>
    <button class="header-settings" onclick="openSettingsSheet()"><i class="ti ti-settings"></i></button>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('review')"><i class="ti ti-clipboard-check"></i>검토하기</div>
    <div class="tab-item" onclick="switchTab('history')"><i class="ti ti-history"></i>이력</div>
  </div>

  <div class="screens">
    <!-- ═══ 검토하기 ═══ -->
    <div id="screen-review" class="screen active">
      <div class="tab-card corner-first">
        <div id="groupListWrap"></div>
        <button class="add-member-btn" style="margin-top:10px;" onclick="openGroupSheet()" type="button"><i class="ti ti-plus"></i>새 모임 만들기</button>
      </div>

      <div id="reviewBody">
        <div class="tab-card">
          <div class="empty-state">
            <i class="ti ti-map-pin-off"></i>
            위에서 모임을 선택하거나<br>새로 만들어 후보를 찾아보세요
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ 이력 ═══ -->
    <div id="screen-history" class="screen">
      <div class="tab-card corner-last">
        <div id="historyListWrap"></div>
      </div>
    </div>
  </div>
</div>

<!-- 모임 편집 시트 -->
<div class="sheet" id="groupSheet">
  <div class="handle"></div>
  <div class="sheet-title" id="groupSheetTitle">모임 만들기</div>
  <div class="field-row">
    <label>모임 이름</label>
    <input id="groupNameInput" type="text" placeholder="예: 주말 라운딩">
  </div>
  <div class="ctrl-label" style="margin-top:0;">동행자</div>
  <div id="memberRowsWrap"></div>
  <button class="add-member-btn" onclick="addMemberRow()" type="button"><i class="ti ti-plus"></i>동행자 추가</button>
  <button class="btn-primary" onclick="saveGroup()">저장</button>
</div>

<!-- 설정 시트 -->
<div class="sheet" id="settingsSheet">
  <div class="handle"></div>
  <div class="sheet-title">설정</div>
  <div class="settings-help" style="margin-top:0;">
    골프장·동행자 위치 확인은 서버(Cloudflare Pages Functions)에서 처리됩니다.
    Kakao API 키는 브라우저에 노출되지 않습니다.
  </div>

  <div class="ctrl-label" style="margin-top:0;">캐시 현황</div>
  <div class="cache-stat"><span>위치 좌표 캐시</span><span id="statGeo">0개</span></div>
  <button class="btn-secondary" style="margin-top:12px;width:100%;justify-content:center;" onclick="clearAllCache()">
    <i class="ti ti-trash"></i>캐시 전체 초기화
  </button>
</div>

<!-- 골프장 상세 (지도 마커 클릭 시) -->
<div class="sheet" id="courseDetailSheet">
  <div class="handle"></div>
  <div class="sheet-title" id="courseDetailTitle">골프장 이름</div>
  <div class="course-addr" id="courseDetailAddr" style="margin-bottom:10px;"></div>
  <span class="badge" id="courseDetailBadge"></span>
  <div class="course-btn-row" style="margin-top:16px;">
    <button class="btn-secondary" id="courseDetailVisitBtn"><i class="ti ti-check"></i>방문 체크</button>
    <button class="btn-secondary" id="courseDetailKakaoBtn"><i class="ti ti-external-link"></i>카카오골프예약</button>
  </div>
</div>

<div id="overlay" onclick="closeAllSheets()"></div>
<div id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════
   상수
══════════════════════════════ */
const AVG_SPEED_KMH = 65; // 직선거리 → 반경 환산용 평균 속도 (시속 60~70km 중간값)
const BASE_TIME_H = 2; // 기본 반경: 동행자별 2시간 상당 거리
const TIME_STEP_H = 0.5; // 교집합 후보가 부족하면 30분씩 단계적으로 확대
const MIN_CANDIDATES = 3; // 이 개수 이상 나올 때까지 반경 확대
const MAX_RADIUS_STEPS = 6; // 안전판: 최대 2h + 6×0.5h = 5시간 상당까지만 확대
const REGION_MARGIN_KM = 35; // 좌표 미확보 골프장의 지역 중심점 추정 오차 보정용 여유 반경
const GEOCODE_API = '/api/geocode';
const CONFIG_API = '/api/config';
const TWO_CHAR_SURNAMES = ['남궁', '황보', '제갈', '선우', '독고', '사공', '서문', '동방'];

// 좌표가 아직 없는 골프장(지식 기반 등록분)의 대략적인 지역 중심 좌표.
// 반경 필터 단계에서 "지오코딩해볼 가치가 있는지"를 싸게 먼저 걸러내는 용도이며,
// 실제 후보 확정은 지오코딩 후 정확한 좌표로 다시 검증한다.
const REGION_CENTROIDS = {
  '강릉시': [37.751, 128.876], '거제시': [34.881, 128.621], '경산시': [35.825, 128.741],
  '경주시': [35.856, 129.225], '광주광역시': [35.160, 126.851], '광주시': [37.429, 127.255],
  '김포시': [37.615, 126.716], '김해시': [35.228, 128.889], '남양주시': [37.636, 127.216],
  '대구광역시': [35.871, 128.601], '무주군': [36.007, 127.661], '서귀포시': [33.253, 126.560],
  '안성시': [37.008, 127.280], '양산시': [35.335, 129.038], '양양군': [38.075, 128.619],
  '여주시': [37.298, 127.637], '용인시': [37.241, 127.177], '울산광역시': [35.538, 129.311],
  '원주시': [37.342, 127.920], '이천시': [37.272, 127.435], '인천광역시': [37.456, 126.705],
  '정선군': [37.380, 128.661], '제주시': [33.499, 126.531], '춘천시': [37.881, 127.730],
  '파주시': [37.760, 126.780], '평창군': [37.370, 128.390], '포천시': [37.895, 127.200],
  '홍천군': [37.697, 127.888], '화성시': [37.199, 126.831], '화순군': [35.064, 126.986],
  '횡성군': [37.491, 127.985],
};

/* ══════════════════════════════
   저장소 헬퍼
══════════════════════════════ */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let groups = load('mygolf_groups', []);
let selectedGroupId = load('mygolf_selectedGroup', null);
let visited = load('mygolf_visited', {});
let settings = load('mygolf_settings', { typeFilter: 'all' });
let geoCache = load('mygolf_geo', {});

let COURSES = [];
let lastComputed = null; // { groupId, courses:[...], membersGeo:[...], usedTimeH, usedRadiusKm }
let mapInstance = null;
let mapOverlays = [];
let kakaoMapsLoadPromise = null;

/* ══════════════════════════════
   탭 전환
══════════════════════════════ */
const TABS = ['review', 'history'];
let currentTab = 'review';
let tabSwitching = false;
function switchTab(t) {
  if (t === currentTab || tabSwitching) return;
  const idx = TABS.indexOf(t);
  const curIdx = TABS.indexOf(currentTab);
  const forward = idx > curIdx;

  const oldScreen = document.getElementById('screen-' + currentTab);
  const newScreen = document.getElementById('screen-' + t);
  currentTab = t;

  document.querySelectorAll('.tab-item').forEach((el, i) => el.classList.toggle('active', TABS[i] === t));
  const card = newScreen.querySelector('.tab-card');
  if (card) {
    card.classList.toggle('corner-first', idx === 0);
    card.classList.toggle('corner-last', idx === TABS.length - 1);
  }

  tabSwitching = true;
  newScreen.style.transition = 'none';
  newScreen.style.transform = `translateX(${forward ? 100 : -100}%)`;
  newScreen.classList.add('active');
  oldScreen.style.transition = 'none';
  oldScreen.style.transform = 'translateX(0)';

  // 지도(카카오맵)는 컨테이너가 display:none인 상태에서 생성하면 크기를 0으로 읽어
  // 깨지므로, 화면이 .active(display:block)가 된 뒤에 렌더링한다.
  if (t === 'review') renderReviewBody();
  if (t === 'history') renderHistory();

  void newScreen.offsetWidth;

  requestAnimationFrame(() => {
    oldScreen.style.transition = newScreen.style.transition = 'transform .25s ease';
    oldScreen.style.transform = `translateX(${forward ? -100 : 100}%)`;
    newScreen.style.transform = 'translateX(0)';
  });

  let cleaned = false;
  const cleanup = () => {
    if (cleaned) return;
    cleaned = true;
    oldScreen.classList.remove('active');
    oldScreen.style.transition = oldScreen.style.transform = '';
    newScreen.style.transition = newScreen.style.transform = '';
    tabSwitching = false;
    newScreen.removeEventListener('transitionend', cleanup);
  };
  newScreen.addEventListener('transitionend', cleanup);
  setTimeout(cleanup, 300);
}

/* ── 탭바 영역에서만 스와이프 ── */
(function initTabSwipe() {
  const SWIPE_MIN_X = 50, SWIPE_MAX_Y = 80, SWIPE_MAX_TIME = 600, INTENT_THRESHOLD = 10;
  let startX = 0, startY = 0, startT = 0, lastX = 0, lastY = 0, tracking = false, swiping = false;

  function resolveSwipe(dx, dy, dt) {
    if (dt > SWIPE_MAX_TIME) return;
    if (Math.abs(dx) < SWIPE_MIN_X || Math.abs(dy) > SWIPE_MAX_Y) return;
    const idx = TABS.indexOf(currentTab);
    if (dx < 0 && idx < TABS.length - 1) switchTab(TABS[idx + 1]);
    else if (dx > 0 && idx > 0) switchTab(TABS[idx - 1]);
  }

  const bar = document.querySelector('.tab-bar');
  bar.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true; swiping = false;
    startX = lastX = e.touches[0].clientX;
    startY = lastY = e.touches[0].clientY;
    startT = Date.now();
  }, { passive: true });

  bar.addEventListener('touchmove', e => {
    if (!tracking || e.touches.length !== 1) return;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    const dx = lastX - startX, dy = lastY - startY;
    if (!swiping) {
      if (Math.abs(dx) < INTENT_THRESHOLD && Math.abs(dy) < INTENT_THRESHOLD) return;
      if (Math.abs(dx) <= Math.abs(dy)) { tracking = false; return; }
      swiping = true;
    }
    e.preventDefault();
  }, { passive: false });

  bar.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    if (!swiping) return;
    swiping = false;
    const touch = e.changedTouches[0];
    resolveSwipe(touch.clientX - startX, touch.clientY - startY, Date.now() - startT);
  }, { passive: true });

  bar.addEventListener('touchcancel', () => {
    if (!tracking) return;
    tracking = false;
    if (!swiping) return;
    swiping = false;
    resolveSwipe(lastX - startX, lastY - startY, Date.now() - startT);
  }, { passive: true });
})();

/* ══════════════════════════════
   유틸
══════════════════════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function normAddrKey(s) { return 'addr:' + s.trim().replace(/\s+/g, ' '); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ══════════════════════════════
   모임 탭
══════════════════════════════ */
function renderGroupList() {
  const wrap = document.getElementById('groupListWrap');
  if (groups.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><i class="ti ti-users"></i>아직 모임이 없어요<br>아래 '새 모임 만들기' 버튼으로 만들어보세요</div>`;
    return;
  }
  wrap.innerHTML = groups.map(g => {
    const preview = g.members.map(m => `${m.name}(${m.addr || '동네 미입력'})`).join(', ');
    const sel = g.id === selectedGroupId;
    return `
    <div class="group-card ${sel ? 'selected' : ''}" onclick="selectGroup('${g.id}')">
      <div class="group-card-top">
        <div class="group-name">${escapeHtml(g.name)}</div>
        <div class="group-actions">
          <button class="icon-btn neutral labeled" onclick="event.stopPropagation();openGroupSheet('${g.id}')"><i class="ti ti-pencil"></i>수정</button>
          <button class="icon-btn labeled" onclick="event.stopPropagation();deleteGroup('${g.id}')"><i class="ti ti-trash"></i>삭제</button>
        </div>
      </div>
      <div class="group-members">${g.members.length}명 · ${escapeHtml(preview)}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function selectGroup(id) {
  selectedGroupId = id;
  save('mygolf_selectedGroup', selectedGroupId);
  renderGroupList();
  renderReviewBody();
  document.getElementById('reviewBody').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deleteGroup(id) {
  groups = groups.filter(g => g.id !== id);
  save('mygolf_groups', groups);
  if (selectedGroupId === id) { selectedGroupId = null; save('mygolf_selectedGroup', null); }
  renderGroupList();
  renderReviewBody();
  toast('모임을 삭제했습니다');
}

let editingGroupId = null;
function openGroupSheet(id) {
  editingGroupId = id || null;
  const g = id ? groups.find(x => x.id === id) : null;
  document.getElementById('groupSheetTitle').textContent = g ? '모임 수정' : '모임 만들기';
  document.getElementById('groupNameInput').value = g ? g.name : '';
  const wrap = document.getElementById('memberRowsWrap');
  wrap.innerHTML = '';
  const members = g ? g.members : [{ name: '', addr: '' }, { name: '', addr: '' }];
  members.forEach(m => addMemberRow(m.name, m.addr));
  openSheet(document.getElementById('groupSheet'));
}

function addMemberRow(name = '', addr = '') {
  const wrap = document.getElementById('memberRowsWrap');
  const row = document.createElement('div');
  row.className = 'member-row';
  row.innerHTML = `
    <input class="member-name-input" type="text" placeholder="이름" value="${escapeHtml(name)}">
    <input class="member-addr-input" type="text" placeholder="동네 (예: 성남시 분당구 정자동)" value="${escapeHtml(addr)}">
    <button class="icon-btn" type="button" onclick="this.parentElement.remove()"><i class="ti ti-x"></i></button>
  `;

}

function saveGroup() {
  const name = document.getElementById('groupNameInput').value.trim();
  if (!name) { toast('모임 이름을 입력하세요'); return; }
  const rows = [...document.querySelectorAll('#memberRowsWrap .member-row')];
  const members = rows.map(r => {
    const [nameEl, addrEl] = r.querySelectorAll('input');
    return { id: uid(), name: nameEl.value.trim(), addr: addrEl.value.trim() };
  }).filter(m => m.name && m.addr);
  if (members.length === 0) { toast('동행자를 1명 이상 입력하세요'); return; }

  let group;
  if (editingGroupId) {
    group = groups.find(x => x.id === editingGroupId);
    group.name = name; group.members = members;
  } else {
    group = { id: uid(), name, members };
    groups.push(group);
  }
  save('mygolf_groups', groups);
  selectedGroupId = group.id;
  save('mygolf_selectedGroup', selectedGroupId);
  closeAllSheets();
  renderGroupList();
  renderReviewBody();
  toast('저장되었습니다');
}

/* ══════════════════════════════
   카카오 API (Cloudflare Pages Functions 프록시 경유 — 키는 서버에만 존재)
══════════════════════════════ */
function isFatalErr(e) { return e.message === 'SERVER_NOT_CONFIGURED' || e.message === 'KAKAO_UNAUTHORIZED'; }
function fatalApiError(data) {
  if (data.error === 'server_not_configured') return new Error('SERVER_NOT_CONFIGURED');
  if (data.error === 'kakao_unauthorized') return new Error('KAKAO_UNAUTHORIZED');
  return null;
}
async function kakaoGeocode(query) {
  const key = normAddrKey(query);
  if (geoCache[key]) return geoCache[key];
  const res = await fetch(`${GEOCODE_API}?q=${encodeURIComponent(query)}`);
  const data = await res.json();
  const fatal = fatalApiError(data);
  if (fatal) throw fatal;
  if (!res.ok || data.error) return null;
  const result = { lat: data.lat, lng: data.lng, address: data.address, ts: Date.now() };
  geoCache[key] = result;
  save('mygolf_geo', geoCache);
  return result;
}

/* ══════════════════════════════
   골프장 데이터 로드
══════════════════════════════ */
async function loadCourses() {
  const res = await fetch('/data/golf-courses.json');
  const base = await res.json();
  COURSES = base.map(c => {
    const cached = geoCache['course:' + c.id];
    return cached ? { ...c, lat: cached.lat, lng: cached.lng, address: cached.address } : { ...c };
  });
}

/* ══════════════════════════════
   카카오맵 SDK 로드 (JS 키는 /api/config를 통해 받아옴 — 도메인 제한된 공개용 키)
══════════════════════════════ */
function loadKakaoMaps() {
  if (kakaoMapsLoadPromise) return kakaoMapsLoadPromise;
  kakaoMapsLoadPromise = fetch(CONFIG_API).then(r => r.json()).then(cfg => {
    if (!cfg.kakaoJsKey) throw new Error('NO_JS_KEY');
    if (window.kakao && window.kakao.maps) return;
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(cfg.kakaoJsKey)}&autoload=false`;
      script.onload = () => window.kakao.maps.load(resolve);
      script.onerror = () => reject(new Error('MAP_SDK_LOAD_FAILED'));
      document.head.appendChild(script);
    });
  });
  kakaoMapsLoadPromise.catch(() => { kakaoMapsLoadPromise = null; }); // 실패 시 다음 시도에서 재시도할 수 있게
  return kakaoMapsLoadPromise;
}

/* ══════════════════════════════
   동행자 성씨 라벨 (지도 마커 표시용)
══════════════════════════════ */
function splitSurname(fullName) {
  const n = (fullName || '').trim();
  for (const s of TWO_CHAR_SURNAMES) {
    if (n.startsWith(s) && n.length > s.length) return { surname: s, given: n.slice(s.length) };
  }
  return { surname: n.slice(0, 1), given: n.slice(1) };
}
function buildMemberLabels(members) {
  const parsed = members.map(m => ({ ...m, ...splitSurname(m.name) }));
  const counts = {};
  parsed.forEach(p => { counts[p.surname] = (counts[p.surname] || 0) + 1; });
  return parsed.map(p => ({
    ...p,
    label: counts[p.surname] > 1 ? (p.surname + (p.given.slice(0, 1) || '')) : p.surname
  }));
}

/* ══════════════════════════════
   검토하기 탭 (모임 선택/생성 → 후보 찾기 → 지도+결과)
══════════════════════════════ */
function renderReviewBody() {
  const body = document.getElementById('reviewBody');
  const group = groups.find(g => g.id === selectedGroupId);

  if (!group) {
    body.innerHTML = `<div class="tab-card"><div class="empty-state"><i class="ti ti-map-pin-off"></i>위에서 모임을 선택하거나<br>새로 만들어 후보를 찾아보세요</div></div>`;
    return;
  }

  const hasData = lastComputed && lastComputed.groupId === group.id;

  body.innerHTML = `
    <div class="tab-card">
      <div class="ctrl-label" style="margin-top:0;">선택된 모임</div>
      <div class="course-summary" style="margin-bottom:12px;"><b>${escapeHtml(group.name)}</b> · ${group.members.length}명</div>

      <div class="ctrl-label">시설 구분</div>
      <div class="segment" id="facilitySeg">
        <div class="segment-item ${settings.typeFilter === 'all' ? 'active' : ''}" data-v="all" onclick="setTypeFilter('all')">전체</div>
        <div class="segment-item ${settings.typeFilter === '회원제' ? 'active' : ''}" data-v="회원제" onclick="setTypeFilter('회원제')">회원제</div>
        <div class="segment-item ${settings.typeFilter === '대중제' ? 'active' : ''}" data-v="대중제" onclick="setTypeFilter('대중제')">대중제</div>
      </div>

      <div class="calc-btn-row">
        <button class="btn-primary" id="calcBtn" onclick="findCandidates()">
          <i class="ti ti-search" style="vertical-align:-2px;"></i> ${hasData ? '후보 다시 찾기' : '후보 찾기'}
        </button>
        <div class="calc-progress hidden" id="calcProgress"></div>
      </div>
    </div>

    <div class="tab-card map-card" id="mapCard">
      ${hasData
        ? `<div id="mapInfo" class="course-summary" style="margin-bottom:10px;"></div>
           <div id="mapContainer"></div>
           <div class="map-legend">
             <span><span class="map-legend-dot" style="background:#2E9E5B;"></span>동행자</span>
             <span><span class="map-legend-dot" style="background:var(--accent);"></span>골프장 후보</span>
           </div>`
        : `<div class="empty-state"><i class="ti ti-map-pin"></i>"후보 찾기"를 눌러<br>지도에서 후보를 확인해보세요</div>`
      }
    </div>
  `;

  if (hasData) renderMap({ freshContainer: true });
}

function setTypeFilter(k) {
  settings.typeFilter = k;
  save('mygolf_settings', settings);
  const seg = document.getElementById('facilitySeg');
  if (seg) seg.querySelectorAll('.segment-item').forEach(el => el.classList.toggle('active', el.dataset.v === k));
  if (lastComputed) renderMap({ freshContainer: false });
}

async function findCandidates() {
  const group = groups.find(g => g.id === selectedGroupId);
  if (!group) { toast('모임을 먼저 선택하세요'); return; }

  const btn = document.getElementById('calcBtn');
  const progress = document.getElementById('calcProgress');
  btn.disabled = true;
  progress.classList.remove('hidden');

  try {
    // 1) 동행자 주소 지오코딩 (반경 계산의 기준점이므로 가장 먼저 필요)
    for (let i = 0; i < group.members.length; i++) {
      const m = group.members[i];
      const key = normAddrKey(m.addr);
      if (!geoCache[key]) {
        progress.textContent = `동행자 위치 확인 중 (${i + 1}/${group.members.length})`;
        try { await kakaoGeocode(m.addr); } catch (e) { if (isFatalErr(e)) throw e; /* skip */ }
        await sleep(80);
      }
    }
    const membersGeo = group.members.map(m => ({ ...m, geo: geoCache[normAddrKey(m.addr)] })).filter(m => m.geo);
    if (membersGeo.length === 0) {
      toast('동행자 동네 위치를 확인하지 못했습니다. 동/구 단위까지 정확히 입력해주세요');
      return;
    }

    // 2) 동행자별 반경 원의 교집합으로 필터 (직선거리 → 시간 환산, 하버사인 공식, API 호출 없음)
    //    좌표가 이미 있는 골프장은 정확한 거리로, 아직 없는 골프장은 지역 중심좌표 + 여유반경으로
    //    "지오코딩해볼 가치가 있는지"만 싸게 판단한다. 후보가 MIN_CANDIDATES개 미만이면
    //    반경을 단계적으로 넓혀 재시도한다.
    function withinRadius(c, radiusKm) {
      const centroid = c.lat ? null : REGION_CENTROIDS[c.region];
      const pos = c.lat ? { lat: c.lat, lng: c.lng } : (centroid ? { lat: centroid[0], lng: centroid[1] } : null);
      if (!pos) return false;
      const margin = c.lat ? 0 : REGION_MARGIN_KM;
      return membersGeo.every(m => haversineKm(m.geo.lat, m.geo.lng, pos.lat, pos.lng) <= radiusKm + margin);
    }

    let timeH = BASE_TIME_H;
    let radiusKm = AVG_SPEED_KMH * timeH;
    let roughFiltered = [];
    for (let step = 0; step <= MAX_RADIUS_STEPS; step++) {
      radiusKm = AVG_SPEED_KMH * timeH;
      roughFiltered = COURSES.filter(c => withinRadius(c, radiusKm));
      progress.textContent = `탐색 반경 확인 중 (${timeH}시간 상당 · 후보 ${roughFiltered.length}곳)`;
      if (roughFiltered.length >= MIN_CANDIDATES || step === MAX_RADIUS_STEPS) break;
      timeH += TIME_STEP_H;
    }

    if (roughFiltered.length === 0) {
      toast('교집합 반경 내 골프장을 찾지 못했습니다. 동행자 동네를 확인해주세요');
      return;
    }

    // 3) 위 후보 중 좌표가 아직 없는 것만 지오코딩 (전체 골프장이 아니라 후보로 좁혀진 것만)
    const needGeoCourses = roughFiltered.filter(c => !c.lat);
    for (let i = 0; i < needGeoCourses.length; i++) {
      const c = needGeoCourses[i];
      progress.textContent = `골프장 위치 확인 중 (${i + 1}/${needGeoCourses.length})`;
      try {
        const g = await kakaoGeocode(`${c.region} ${c.name}`);
        if (g) { c.lat = g.lat; c.lng = g.lng; c.address = g.address; geoCache['course:' + c.id] = g; save('mygolf_geo', geoCache); }
      } catch (e) { if (isFatalErr(e)) throw e; /* 개별 실패는 건너뜀 */ }
      await sleep(80);
    }

    // 4) 방금 지오코딩된 좌표로 정확하게 재검증 (지역 중심좌표의 여유반경으로 인한 오탐 제거)
    const filtered = roughFiltered.filter(c =>
      c.lat && membersGeo.every(m => haversineKm(m.geo.lat, m.geo.lng, c.lat, c.lng) <= radiusKm)
    );

    if (filtered.length === 0) {
      toast('교집합 반경 내 골프장을 찾지 못했습니다. 동행자 동네를 확인해주세요');
      return;
    }

    lastComputed = { groupId: group.id, courses: filtered, membersGeo, usedTimeH: timeH, usedRadiusKm: Math.round(radiusKm) };
    renderReviewBody();
    toast(`후보 ${filtered.length}곳을 찾았습니다`);
  } catch (e) {
    if (e.message === 'SERVER_NOT_CONFIGURED') toast('서버에 Kakao API 키가 설정되지 않았습니다. 관리자에게 문의하세요');
    else if (e.message === 'KAKAO_UNAUTHORIZED') toast('Kakao API 키가 유효하지 않습니다 (인증 실패). 관리자에게 문의하세요');
    else toast('찾는 중 오류가 발생했습니다: ' + e.message);
  } finally {
    btn.disabled = false;
    progress.classList.add('hidden');
  }
}

async function renderMap(opts) {
  const freshContainer = !!(opts && opts.freshContainer);
  if (!lastComputed) return;

  const container = document.getElementById('mapContainer');
  if (!container) return;

  try {
    await loadKakaoMaps();
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><i class="ti ti-map-pin-off"></i>지도를 불러오지 못했습니다<br>관리자에게 문의하세요</div>`;
    return;
  }

  if (freshContainer || !mapInstance) {
    const first = lastComputed.membersGeo[0].geo;
    mapInstance = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(first.lat, first.lng),
      level: 9
    });
  }

  mapOverlays.forEach(o => o.setMap(null));
  mapOverlays = [];

  const bounds = new kakao.maps.LatLngBounds();

  const labeled = buildMemberLabels(lastComputed.membersGeo.map(m => ({ id: m.id, name: m.name })));
  lastComputed.membersGeo.forEach(m => {
    const found = labeled.find(l => l.id === m.id);
    const label = found ? found.label : (m.name || '').slice(0, 1);
    const el = document.createElement('div');
    el.className = 'map-member-dot';
    el.textContent = label;
    const pos = new kakao.maps.LatLng(m.geo.lat, m.geo.lng);
    const overlay = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5 });
    overlay.setMap(mapInstance);
    mapOverlays.push(overlay);
    bounds.extend(pos);
  });

  const visibleCourses = settings.typeFilter === 'all'
    ? lastComputed.courses
    : lastComputed.courses.filter(c => c.type === settings.typeFilter);

  visibleCourses.forEach(c => {
    const el = document.createElement('div');
    el.className = 'map-course-dot';
    el.innerHTML = '<i class="ti ti-flag"></i>';
    el.addEventListener('click', () => openCourseDetailSheet(c.id));
    const pos = new kakao.maps.LatLng(c.lat, c.lng);
    const overlay = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 0.5, xAnchor: 0.5 });
    overlay.setMap(mapInstance);
    mapOverlays.push(overlay);
    bounds.extend(pos);
  });

  mapInstance.setBounds(bounds);

  const info = document.getElementById('mapInfo');
  if (info) {
    const filterNote = settings.typeFilter === 'all' ? '' : ` 중 ${settings.typeFilter} ${visibleCourses.length}곳 표시 중`;
    info.innerHTML = `탐색 반경: 동행자별 직선거리 약 <b>${lastComputed.usedTimeH}시간</b> 상당(약 ${lastComputed.usedRadiusKm}km) 교집합 · 후보 ${lastComputed.courses.length}곳${filterNote}`;
  }
}

function openCourseDetailSheet(courseId) {
  const c = COURSES.find(x => x.id === courseId);
  if (!c) return;
  const isVisited = !!visited[c.id];
  document.getElementById('courseDetailTitle').textContent = c.name;
  document.getElementById('courseDetailAddr').textContent = c.address || c.region;
  const badge = document.getElementById('courseDetailBadge');
  badge.className = 'badge' + (c.type === '대중제' ? ' public' : '');
  badge.textContent = c.type;
  const visitBtn = document.getElementById('courseDetailVisitBtn');
  visitBtn.className = 'btn-secondary' + (isVisited ? ' on' : '');
  visitBtn.innerHTML = `<i class="ti ti-check"></i>${isVisited ? '방문함' : '방문 체크'}`;
  visitBtn.onclick = () => { toggleVisited(c.id); openCourseDetailSheet(c.id); };
  document.getElementById('courseDetailKakaoBtn').onclick = () => openKakaoGolf(c.id);
  openSheet(document.getElementById('courseDetailSheet'));
}

function toggleVisited(courseId) {
  if (visited[courseId]) delete visited[courseId];
  else visited[courseId] = { date: new Date().toISOString().slice(0, 10) };
  save('mygolf_visited', visited);
}

function openKakaoGolf(courseId) {
  const c = COURSES.find(x => x.id === courseId);
  if (!c) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(c.name).catch(() => {});
  }
  toast(`"${c.name}" 이름이 복사되었습니다. 검색창에 붙여넣으세요`);
  window.open('https://www.kakao.golf/map-search', '_blank');
}

/* ══════════════════════════════
   이력 탭
══════════════════════════════ */
function renderHistory() {
  const wrap = document.getElementById('historyListWrap');
  const entries = Object.entries(visited);
  if (entries.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><i class="ti ti-history"></i>아직 방문 기록이 없어요<br>후보 탭에서 다녀온 골프장을 체크해보세요</div>`;
    return;
  }
  const rows = entries.map(([id, v]) => {
    const c = COURSES.find(x => x.id === id) || { name: id, region: '' };
    return { c, v };
  }).sort((a, b) => (b.v.date || '').localeCompare(a.v.date || ''));

  wrap.innerHTML = rows.map(({ c, v }) => `
    <div class="group-card">
      <div class="group-card-top">
        <div class="group-name">${escapeHtml(c.name)}</div>
        <div class="group-actions">
          <button class="icon-btn" onclick="toggleVisited('${c.id}');renderHistory();"><i class="ti ti-x"></i></button>
        </div>
      </div>
      <div class="group-members">${escapeHtml(c.region || '')} · 방문일 ${v.date}</div>
    </div>
  `).join('');
}

/* ══════════════════════════════
   부트
══════════════════════════════ */
(async function boot() {
  renderGroupList();
  renderReviewBody();
  await loadCourses();
})();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
